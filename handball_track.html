<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handball Track">
<title>Handball Track</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e9f0;
  --accent:#2563eb;--accent2:#7c3aed;--green:#12b76a;--danger:#ef4444;
  --shadow:0 10px 30px rgba(16,24,40,.08);--radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:1180px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 36px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-size:25px;box-shadow:0 8px 20px rgba(37,99,235,.25)}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.5px}
.subtitle{font-size:13px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:9px}
.btn{min-height:46px;padding:0 16px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700;box-shadow:0 3px 10px rgba(16,24,40,.04)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.icon{width:46px;padding:0;font-size:20px}
.hero{background:linear-gradient(135deg,#101828,#1d2939);border-radius:28px;padding:24px;color:#fff;box-shadow:var(--shadow);margin-bottom:20px}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:20px}
.hero h2{margin:0 0 7px;font-size:22px}
.hero p{margin:0;color:#b9c3d2;font-size:14px}
.hero-stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px}
.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:#aab4c3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid rgba(228,233,240,.8);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.exercise-name{font-size:19px;font-weight:800;line-height:1.2}
.exercise-meta{font-size:12px;color:var(--muted);margin-top:5px}
.record{margin:18px 0;display:flex;align-items:end;gap:9px}
.record strong{font-size:48px;letter-spacing:-2px;line-height:.9}
.record span{font-size:13px;color:var(--muted);padding-bottom:5px}
.actions{display:flex;gap:9px}
.actions .btn{flex:1}
.more{background:#f2f4f7;width:38px;height:38px;border-radius:12px;font-size:19px;color:#475467}
.chart-wrap{margin-top:16px;height:120px;position:relative}
canvas{width:100%;height:120px;display:block}
.empty{padding:35px 15px;text-align:center;color:var(--muted);font-size:14px}
.section-title{font-size:17px;font-weight:800;margin:28px 0 12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(5px);display:none;align-items:end;justify-content:center;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;width:min(620px,100%);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.18)}
@media(min-width:700px){.modal-backdrop{align-items:center}.modal{border-radius:26px;padding:26px}}
.modal h3{margin:0 0 18px;font-size:21px}
label{font-size:13px;font-weight:700;color:#475467;display:block;margin:14px 0 7px}
input{width:100%;height:50px;border:1px solid #d0d5dd;border-radius:14px;padding:0 14px;font-size:17px;outline:none;background:#fff}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions .btn{flex:1}
.history{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.history-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px}
.history-row span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101828;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{color:var(--danger)!important}
@media(max-width:650px){
 .app{padding-left:13px;padding-right:13px}
 .grid{grid-template-columns:1fr}
 .hero{padding:20px}
 .hero-row{align-items:flex-start}
 .top-actions .label{display:none}
 .btn.primary{padding:0 13px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">🤾</div>
    <div><h1>Handball Track</h1><div class="subtitle">Seguimiento de entrenamiento</div></div>
  </div>
  <div class="top-actions"><button class="btn primary" onclick="openExercise()">＋ <span class="label">Ejercicio</span></button></div>
</header>

<section class="hero">
  <div class="hero-row">
    <div><h2>Tu evolución</h2><p>Registra tus récords y sigue tu progreso.</p></div>
    <div style="font-size:34px">📈</div>
  </div>
  <div class="hero-stats">
    <div class="stat"><b id="totalExercises">0</b><span>EJERCICIOS</span></div>
    <div class="stat"><b id="totalRecords">0</b><span>REGISTROS</span></div>
    <div class="stat"><b id="bestTotal">0</b><span>RÉCORDS ACTUALES</span></div>
  </div>
</section>

<div class="section-title">Mis ejercicios</div>
<div id="grid" class="grid"></div>
<div id="empty" class="card empty" style="display:none">Todavía no tienes ejercicios.<br>Añade el primero para empezar.</div>
</div>

<div id="modalBg" class="modal-backdrop" onclick="backdrop(event)">
 <div class="modal">
   <h3 id="modalTitle">Nuevo ejercicio</h3>
   <input type="hidden" id="editId">
   <label>Nombre del ejercicio</label>
   <input id="exerciseName" maxlength="70" placeholder="Ej. Pelota al suelo y recoger">
   <div class="modal-actions">
     <button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn primary" onclick="saveExercise()">Guardar</button>
   </div>
 </div>
</div>

<div id="recordBg" class="modal-backdrop" onclick="backdrop(event)">
 <div class="modal">
   <h3 id="recordTitle">Añadir récord</h3>
   <input type="hidden" id="recordExercise">
   <label>Número de veces conseguido</label>
   <input id="recordValue" type="number" min="0" step="1" inputmode="numeric" placeholder="Ej. 27">
   <label>Fecha</label>
   <input id="recordDate" type="date">
   <div class="modal-actions">
     <button class="btn" onclick="closeRecord()">Cancelar</button>
     <button class="btn primary" onclick="saveRecord()">Guardar récord</button>
   </div>
   <div id="history" class="history"></div>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY='handball-track-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{exercises:[
 {id:crypto.randomUUID(),name:'Dejar caer la pelota y recogerla',records:[]}
]};
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(d){return new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))}
function currentRecord(e){return e.records.length?Math.max(...e.records.map(r=>Number(r.value))):0}
function render(){
 const grid=document.getElementById('grid'),empty=document.getElementById('empty');
 grid.innerHTML='';
 data.exercises.forEach(e=>{
   const rec=[...e.records].sort((a,b)=>b.date.localeCompare(a.date));
   const best=currentRecord(e);
   const div=document.createElement('article');div.className='card';
   div.innerHTML=`<div class="card-head"><div><div class="exercise-name">${esc(e.name)}</div><div class="exercise-meta">${e.records.length} ${e.records.length===1?'registro':'registros'}</div></div>
   <button class="more" onclick="exerciseMenu('${e.id}')">⋯</button></div>
   <div class="record"><strong>${best}</strong><span>veces<br>récord actual</span></div>
   <div class="actions"><button class="btn primary" onclick="openRecord('${e.id}')">＋ Registrar récord</button><button class="btn icon" onclick="openRecord('${e.id}',true)">↗</button></div>
   <div class="chart-wrap"><canvas id="c-${e.id}"></canvas></div>`;
   grid.appendChild(div);
   requestAnimationFrame(()=>drawChart(e));
 });
 empty.style.display=data.exercises.length?'none':'block';
 document.getElementById('totalExercises').textContent=data.exercises.length;
 document.getElementById('totalRecords').textContent=data.exercises.reduce((n,e)=>n+e.records.length,0);
 document.getElementById('bestTotal').textContent=data.exercises.reduce((n,e)=>n+currentRecord(e),0);
}
function drawChart(e){
 const c=document.getElementById('c-'+e.id);if(!c)return;
 const rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=rect.width*dpr;c.height=120*dpr;
 const x=c.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=120;
 x.clearRect(0,0,w,h);x.strokeStyle='#edf0f5';x.lineWidth=1;
 for(let i=1;i<4;i++){let y=i*h/4;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}
 const pts=[...e.records].sort((a,b)=>a.date.localeCompare(b.date));
 if(!pts.length){x.fillStyle='#98a2b3';x.font='13px -apple-system,BlinkMacSystemFont,sans-serif';x.fillText('Añade tu primer récord para ver la evolución',8,64);return}
 const vals=pts.map(r=>Number(r.value)),min=Math.min(...vals),max=Math.max(...vals),range=Math.max(1,max-min);
 const px=i=>pts.length===1?w/2:10+i*(w-20)/(pts.length-1);
 const py=v=>h-12-((v-min)/range)*(h-30);
 x.beginPath();pts.forEach((r,i)=>{let X=px(i),Y=py(Number(r.value));i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='#2563eb';x.lineWidth=3;x.lineJoin='round';x.lineCap='round';x.stroke();
 pts.forEach((r,i)=>{let X=px(i),Y=py(Number(r.value));x.beginPath();x.arc(X,Y,4,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle='#2563eb';x.lineWidth=2;x.stroke()});
}
function openExercise(id){
 document.getElementById('editId').value=id||'';document.getElementById('exerciseName').value=id?data.exercises.find(e=>e.id===id).name:'';
 document.getElementById('modalTitle').textContent=id?'Editar ejercicio':'Nuevo ejercicio';document.getElementById('modalBg').classList.add('show');
 setTimeout(()=>document.getElementById('exerciseName').focus(),100);
}
function saveExercise(){
 const name=document.getElementById('exerciseName').value.trim(),id=document.getElementById('editId').value;
 if(!name)return toast('Escribe un nombre');
 if(id)data.exercises.find(e=>e.id===id).name=name;else data.exercises.push({id:crypto.randomUUID(),name,records:[]});
 save();closeModal();render();toast('Ejercicio guardado');
}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function exerciseMenu(id){
 const e=data.exercises.find(x=>x.id===id);
 const action=prompt(`Ejercicio: ${e.name}\n\nEscribe:\n1 — Editar nombre\n2 — Eliminar ejercicio`);
 if(action==='1')openExercise(id);
 if(action==='2' && confirm('¿Eliminar este ejercicio y todo su histórico?')){data.exercises=data.exercises.filter(x=>x.id!==id);save();render();toast('Ejercicio eliminado')}
}
function openRecord(id,historyOnly=false){
 const e=data.exercises.find(x=>x.id===id);
 document.getElementById('recordExercise').value=id;document.getElementById('recordValue').value='';
 document.getElementById('recordDate').value=new Date().toISOString().slice(0,10);
 document.getElementById('recordTitle').textContent=e.name;
 const rows=[...e.records].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('history').innerHTML=rows.length?'<b>Histórico</b>'+rows.map((r,i)=>`<div class="history-row"><span>${fmtDate(r.date)}</span><strong>${r.value} veces</strong><button style="background:none;color:#98a2b3;margin-left:8px" onclick="deleteRecord('${id}','${r.id}')">×</button></div>`).join(''):'<span style="font-size:13px;color:#98a2b3">Sin registros todavía.</span>';
 document.getElementById('recordBg').classList.add('show');
 if(!historyOnly)setTimeout(()=>document.getElementById('recordValue').focus(),100);
}
function saveRecord(){
 const id=document.getElementById('recordExercise').value,v=document.getElementById('recordValue').value,d=document.getElementById('recordDate').value;
 if(v===''||Number(v)<0||!d)return toast('Completa el récord y la fecha');
 data.exercises.find(e=>e.id===id).records.push({id:crypto.randomUUID(),value:Number(v),date:d});
 save();closeRecord();render();toast('Récord registrado');
}
function deleteRecord(eid,rid){
 const e=data.exercises.find(x=>x.id===eid);e.records=e.records.filter(r=>r.id!==rid);save();openRecord(eid,true);render();toast('Registro eliminado');
}
function closeRecord(){document.getElementById('recordBg').classList.remove('show')}
function backdrop(ev){if(ev.target===ev.currentTarget){ev.currentTarget.classList.remove('show')}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeRecord()}});
render();
</script>
</body>
</html>
