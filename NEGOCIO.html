<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mi Segunda Mano</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17202a;--muted:#68717d;--accent:#315efb;--green:#16845b;--red:#c53b45;--border:#e4e7eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--text);color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#cbd1d8;font-size:13px}
main{max-width:1100px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{border:0;background:#e8ebf0;padding:10px 14px;border-radius:10px;font-weight:600;white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;box-shadow:0 2px 8px #00000006}.metric strong{display:block;font-size:26px;margin-top:4px}.metric span{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}.btn.secondary{background:#e9edf3;color:var(--text)}.btn.danger{background:#fff0f1;color:var(--red)}
form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:10px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}.table th{background:#f8f9fb;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f5;font-size:11px;font-weight:700}.pill.green{background:#e5f6ee;color:var(--green)}.pill.red{background:#fff0f1;color:var(--red)}.pill.blue{background:#eaf0ff;color:#315efb}
.product{display:flex;gap:12px;align-items:flex-start}.thumb{width:58px;height:58px;border-radius:10px;background:#eef1f5;object-fit:cover}.product h3{margin:0 0 3px;font-size:15px}.product p{margin:0;color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:150px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px}.day h4{margin:0 0 7px;font-size:12px}.event{background:#eef2ff;border-left:3px solid var(--accent);padding:7px;border-radius:7px;font-size:11px;margin-bottom:6px}.empty{color:var(--muted);font-size:13px;padding:25px;text-align:center}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:1fr}.day{min-height:70px}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.metric strong{font-size:21px}form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>Mi Segunda Mano</h1><p>Gestión de stock · Vinted · Wallapop</p></header>
<main>
<div class="tabs"><button class="tab active" data-view="inicio">Inicio</button><button class="tab" data-view="productos">Productos</button><button class="tab" data-view="nuevo">Nuevo producto</button><button class="tab" data-view="calendario">Calendario</button></div>
<section id="inicio" class="view active">
<div class="grid" id="metrics"></div><div class="card" style="margin-top:14px"><h2>Acciones pendientes</h2><div id="pendientes"></div></div>
</section>
<section id="productos" class="view"><div class="actions"><button class="btn" onclick="showView('nuevo')">+ Nuevo producto</button><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button><button class="btn secondary" onclick="exportJSON()">Copia de seguridad</button><label class="btn secondary">Importar<input id="importFile" type="file" accept="application/json" hidden></label></div><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Talla</th><th>Compra</th><th>Venta</th><th>Beneficio</th><th>Estado</th><th>Plataformas</th><th></th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
<section id="nuevo" class="view"><div class="card"><h2>Nuevo producto</h2><form id="productForm"><div class="field"><label>Código</label><input id="code" placeholder="Z001" required></div><div class="field"><label>Marca</label><input id="brand" placeholder="Nike" required></div><div class="field"><label>Modelo</label><input id="model" placeholder="Revolution 6"></div><div class="field"><label>Talla</label><input id="size" placeholder="31" required></div><div class="field"><label>Categoría</label><select id="category"><option>Zapatillas</option><option>Botas</option><option>Sandalias</option><option>Zapatos escolares</option><option>Otro</option></select></div><div class="field"><label>Estado</label><select id="condition"><option>Muy buen estado</option><option>Buen estado</option><option>Como nuevo</option><option>Con desgaste</option></select></div><div class="field"><label>Precio de compra (€)</label><input id="buy" type="number" step="0.01" min="0" required></div><div class="field"><label>Precio de venta (€)</label><input id="sell" type="number" step="0.01" min="0" required></div><div class="field"><label>Precio mínimo (€)</label><input id="min" type="number" step="0.01" min="0"></div><div class="field"><label>Fecha prevista de publicación</label><input id="date" type="date"></div><div class="field"><label>Vinted</label><select id="vinted"><option>No</option><option>Sí</option></select></div><div class="field"><label>Wallapop</label><select id="wallapop"><option>No</option><option>Sí</option></select></div><div class="field full"><label>Notas / defectos</label><textarea id="notes" placeholder="Suela, interior, pequeñas marcas..."></textarea></div><div class="field full"><label>Descripción del anuncio</label><textarea id="description" placeholder="La app generará una descripción base si lo dejas vacío."></textarea></div><div class="field full"><button class="btn" type="submit">Guardar producto</button></div></form></div></section>
<section id="calendario" class="view"><div class="card"><h2>Calendario de publicaciones</h2><p style="color:var(--muted);font-size:13px">Los productos se agrupan por fecha prevista. La publicación dentro de Vinted/Wallapop sigue siendo manual.</p><div class="calendar" id="calendar"></div></div></section>
</main>
<script>
const KEY='segunda_mano_v1'; let products=JSON.parse(localStorage.getItem(KEY)||'[]');
const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(products)); render();}
function showView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelector(`[data-view="${id}"]`).classList.add('active');render();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function title(p){return `${p.brand} ${p.model||''} ${p.category.toLowerCase()} infantil talla ${p.size}`.replace(/\s+/g,' ').trim()}
function generated(p){return `${title(p)}\n\n${p.brand} ${p.model||''} en ${p.condition.toLowerCase()}.\n\n• Talla: ${p.size}\n• Marca: ${p.brand}\n• Categoría: ${p.category}\n• Estado: ${p.condition}\n${p.notes?'• Detalles: '+p.notes+'\n':''}\nSe envía bien protegido. Si necesitas alguna medida o fotografía adicional, puedes preguntarme.`}
function render(){
 const active=products.filter(p=>p.status!=='Vendido');const sold=products.filter(p=>p.status==='Vendido');const revenue=sold.reduce((s,p)=>s+Number(p.sell),0);const profit=sold.reduce((s,p)=>s+(Number(p.sell)-Number(p.buy)),0);const pending=active.filter(p=>p.status==='Por publicar').length;
 document.getElementById('metrics').innerHTML=[['Stock activo',active.length],['Por publicar',pending],['Vendidos',sold.length],['Beneficio realizado',euro(profit)]].map(x=>`<div class="card metric"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');
 const pp=active.filter(p=>p.status==='Por publicar').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,8);document.getElementById('pendientes').innerHTML=pp.length?pp.map(p=>`<div class="product" style="padding:9px 0;border-bottom:1px solid var(--border)"><div><h3>${title(p)}</h3><p>${p.date||'Sin fecha'} · ${euro(p.sell)} · ${p.vinted==='Sí'?'Vinted ':''}${p.wallapop==='Sí'?'Wallapop':''}</p></div></div>`).join(''):'<div class="empty">No hay publicaciones pendientes.</div>';
 document.getElementById('productsBody').innerHTML=products.length?products.map(p=>{let pr=Number(p.sell)-Number(p.buy);let plats=[p.vinted==='Sí'?'Vinted':'',p.wallapop==='Sí'?'Wallapop':''].filter(Boolean).join(' + ');return `<tr><td><b>${title(p)}</b><br><span class="pill">${p.code}</span></td><td>${p.size}</td><td>${euro(p.buy)}</td><td>${euro(p.sell)}</td><td>${euro(pr)}</td><td><span class="pill ${p.status==='Vendido'?'green':p.status==='Por publicar'?'blue':''}">${p.status}</span></td><td>${plats||'—'}</td><td><button class="btn secondary" onclick="copyAd('${p.id}')">Copiar anuncio</button> <button class="btn danger" onclick="removeProduct('${p.id}')">Eliminar</button></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Todavía no tienes productos.</td></tr>';
 renderCalendar();
}
function renderCalendar(){const el=document.getElementById('calendar');let days=[];let now=new Date();for(let i=0;i<7;i++){let d=new Date(now);d.setDate(now.getDate()+i);let iso=d.toISOString().slice(0,10);let label=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});let ps=products.filter(p=>p.date===iso&&p.status!=='Vendido');days.push(`<div class="day"><h4>${label}</h4>${ps.length?ps.map(p=>`<div class="event"><b>${p.brand} ${p.size}</b><br>${p.vinted==='Sí'?'Vinted ':''}${p.wallapop==='Sí'?'Wallapop':''}</div>`).join(''):'<span style="color:#9aa2ad;font-size:11px">Sin publicaciones</span>'}</div>`)}el.innerHTML=days.join('')}
document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let p={id:crypto.randomUUID(),code:code.value.trim(),brand:brand.value.trim(),model:model.value.trim(),size:size.value.trim(),category:category.value,condition:condition.value,buy:Number(buy.value),sell:Number(sell.value),min:Number(min.value)||0,date:date.value,vinted:vinted.value,wallapop:wallapop.value,notes:notes.value.trim(),description:description.value.trim(),status:'Por publicar',created:new Date().toISOString()};if(!p.description)p.description=generated(p);products.push(p);save();e.target.reset();showView('productos')};
function copyAd(id){let p=products.find(x=>x.id===id);navigator.clipboard.writeText(p.description);alert('Anuncio copiado al portapapeles.');}
function removeProduct(id){if(confirm('¿Eliminar este producto?')){products=products.filter(p=>p.id!==id);save()}}
function exportJSON(){let blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});download(blob,'mi-segunda-mano-backup.json')}
function exportCSV(){let rows=[['Código','Marca','Modelo','Talla','Categoría','Estado','Compra','Venta','Beneficio','Fecha','Vinted','Wallapop','Estado venta']];products.forEach(p=>rows.push([p.code,p.brand,p.model,p.size,p.category,p.condition,p.buy,p.sell,p.sell-p.buy,p.date,p.vinted,p.wallapop,p.status]));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'mi-segunda-mano.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{products=JSON.parse(r.result);save();alert('Copia restaurada.')}catch{alert('Archivo no válido.')}};r.readAsText(f)};
render();
</script></body></html>
